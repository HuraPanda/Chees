<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Chess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #140707;
            --bg-2: #2a0907;
            --bg-3: #7b1e12;
            --bg-4: #d25a16;
            --panel: rgba(26, 10, 9, 0.74);
            --board-light: #f0a34a;
            --board-dark: #1d0d0c;
            --line: rgba(255, 145, 54, 0.16);
            --text: #fff2e8;
            --muted: rgba(255, 216, 188, 0.72);
            --accent: #f05a28;
            --accent-soft: rgba(240, 90, 40, 0.24);
            --turn-white: rgba(255, 196, 144, 0.14);
            --turn-black: #120707;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            font-family: "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(140deg, var(--bg-1), var(--bg-2) 38%, var(--bg-3) 70%, var(--bg-4));
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -18%;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 18% 28%, rgba(255, 119, 56, 0.34), transparent 24%),
                radial-gradient(circle at 74% 16%, rgba(255, 166, 72, 0.28), transparent 20%),
                radial-gradient(circle at 80% 74%, rgba(183, 28, 28, 0.3), transparent 28%),
                radial-gradient(circle at 26% 80%, rgba(255, 104, 46, 0.2), transparent 24%);
            filter: blur(18px);
            animation: driftGlow 20s ease-in-out infinite alternate;
        }

        body::after {
            background:
                linear-gradient(115deg, transparent 18%, rgba(255, 162, 66, 0.16) 35%, transparent 50%),
                linear-gradient(295deg, transparent 24%, rgba(255, 86, 42, 0.16) 46%, transparent 62%);
            background-size: 180% 180%;
            mix-blend-mode: screen;
            opacity: 0.95;
            animation: shimmerSweep 16s linear infinite;
        }

        @keyframes driftGlow {
            0% {
                transform: translate3d(-2%, -1%, 0) scale(1);
            }

            50% {
                transform: translate3d(3%, 2%, 0) scale(1.04);
            }

            100% {
                transform: translate3d(-1%, 4%, 0) scale(1.08);
            }
        }

        @keyframes shimmerSweep {
            0% {
                transform: translate3d(-4%, 0, 0) rotate(0deg);
                background-position: 0% 50%;
            }

            100% {
                transform: translate3d(4%, -2%, 0) rotate(4deg);
                background-position: 100% 50%;
            }
        }

        .app {
            width: min(1120px, 100%);
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            position: relative;
            z-index: 1;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(20px);
            padding: 24px;
        }

        .sidebar {
            display: grid;
            gap: 16px;
            align-content: start;
        }

        h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        p {
            margin: 0;
            font-weight: 500;
            line-height: 1.5;
        }

        .panel {
            padding: 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
        }

        .turn {
            display: grid;
            gap: 10px;
        }

        .turn-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--line);
        }

        .turn-badge.white {
            background: var(--turn-white);
            color: var(--text);
        }

        .turn-badge.black {
            background: var(--turn-black);
            color: #ffd8bb;
        }

        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.75;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            font: inherit;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            padding: 10px 14px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid var(--line);
        }

        button:hover {
            filter: brightness(1.04);
        }

        .status {
            min-height: 96px;
            display: grid;
            gap: 8px;
        }

        .meta {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .captured {
            display: grid;
            gap: 10px;
        }

        .captured-row {
            display: grid;
            gap: 6px;
        }

        .captured-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .captured-count {
            font-size: 13px;
            color: var(--muted);
        }

        .captured-pieces {
            min-height: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            line-height: 1.1;
            letter-spacing: normal;
            overflow: hidden;
        }

        .captured-pieces.empty {
            display: block;
            font-size: 14px;
            letter-spacing: normal;
            color: var(--muted);
        }

        .captured-piece .piece-shell {
            width: 22px;
            height: 22px;
            font-size: 1em;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.16));
        }

        .board-wrap {
            display: grid;
            gap: 10px;
            align-content: start;
        }

        .axis-files {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            padding-left: 26px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .board-area {
            display: grid;
            grid-template-columns: 24px 1fr;
            gap: 10px;
            align-items: stretch;
        }

        .axis-ranks {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            align-items: center;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .board {
            aspect-ratio: 1;
            position: relative;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: inset 0 0 0 1px rgba(255, 132, 48, 0.08);
        }

        .victory-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at center, rgba(255, 136, 58, 0.16), rgba(16, 5, 5, 0.78) 58%),
                rgba(0, 0, 0, 0.38);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 10;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        .victory-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .victory-card {
            position: relative;
            width: min(360px, 100%);
            padding: 28px 24px 22px;
            border-radius: 26px;
            border: 1px solid rgba(255, 168, 88, 0.28);
            background: linear-gradient(160deg, rgba(39, 12, 10, 0.96), rgba(19, 7, 7, 0.92));
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.42),
                inset 0 0 0 1px rgba(255, 136, 58, 0.06);
            text-align: center;
            overflow: hidden;
            animation: victoryRise 560ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .victory-card::before,
        .victory-card::after {
            content: "";
            position: absolute;
            inset: auto;
            border-radius: 999px;
            pointer-events: none;
        }

        .victory-card::before {
            width: 260px;
            height: 260px;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(255, 161, 86, 0.3), transparent 64%);
            animation: victoryPulse 2.2s ease-in-out infinite;
        }

        .victory-card::after {
            width: 160%;
            height: 2px;
            left: -30%;
            top: 46px;
            background: linear-gradient(90deg, transparent, rgba(255, 188, 122, 0.58), transparent);
            opacity: 0.75;
        }

        .victory-kicker {
            position: relative;
            z-index: 1;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 202, 150, 0.82);
        }

        .victory-title {
            position: relative;
            z-index: 1;
            margin: 0;
            font-size: clamp(32px, 7vw, 46px);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #fff4e7;
            text-shadow:
                0 0 18px rgba(255, 153, 72, 0.18),
                0 8px 22px rgba(0, 0, 0, 0.38);
        }

        .victory-text {
            position: relative;
            z-index: 1;
            margin: 12px 0 20px;
            color: var(--muted);
            font-size: 15px;
        }

        .victory-button {
            position: relative;
            z-index: 1;
            min-width: 168px;
            box-shadow: 0 12px 28px rgba(240, 90, 40, 0.26);
        }

        @keyframes victoryRise {
            0% {
                transform: translateY(18px) scale(0.94);
                opacity: 0;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes victoryPulse {
            0%,
            100% {
                transform: translateX(-50%) scale(0.96);
                opacity: 0.68;
            }

            50% {
                transform: translateX(-50%) scale(1.08);
                opacity: 1;
            }
        }

        .animation-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 8;
        }

        .cell {
            position: relative;
            padding: 0;
            margin: 0;
            border-radius: 0;
            border: none;
            background: transparent;
            display: grid;
            place-items: center;
            font-size: 46px;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        .cell:hover {
            transform: scale(0.985);
            box-shadow: inset 0 0 0 2px rgba(255, 147, 58, 0.22);
        }

        .cell.light {
            background: var(--board-light);
        }

        .cell.dark {
            background: var(--board-dark);
        }

        .cell.selected::after,
        .cell.last-from::after,
        .cell.last-to::after {
            content: "";
            position: absolute;
            inset: 10%;
            border-radius: 16px;
            pointer-events: none;
        }

        .cell.selected::after {
            border: 3px solid var(--accent);
        }

        .cell.last-from::after,
        .cell.last-to::after {
            border: 2px solid rgba(255, 154, 80, 0.55);
        }

        .cell.move::before,
        .cell.capture::before {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .cell.move::before {
            width: 26%;
            height: 26%;
            border-radius: 999px;
            background: var(--accent-soft);
            box-shadow: 0 0 0 12px rgba(240, 90, 40, 0.08);
        }

        .cell.capture::before {
            inset: 14%;
            border-radius: 999px;
            border: 4px solid rgba(255, 130, 54, 0.5);
        }

        .piece-shell {
            position: relative;
            width: 78%;
            height: 78%;
            display: grid;
            place-items: center;
            z-index: 1;
            font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif;
            user-select: none;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.28));
        }

        .piece-layer {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            line-height: 1;
        }

        .cell.anim-source .piece-shell,
        .cell.anim-capture .piece-shell {
            opacity: 0;
        }

        .piece-shell.white .piece-depth {
            transform: translate(0.085em, 0.11em) scale(1.03);
            color: rgba(98, 45, 26, 0.55);
            filter: blur(0.35px);
        }

        .piece-shell.white .piece-core {
            color: #fff6ee;
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.95),
                0 0 1px rgba(89, 42, 22, 0.32),
                0 10px 16px rgba(54, 19, 8, 0.18);
            -webkit-text-stroke: 0.5px rgba(103, 49, 27, 0.2);
        }

        .piece-shell.white .piece-highlight {
            transform: translate(-0.02em, -0.03em);
            color: rgba(255, 255, 255, 0.72);
            filter: blur(0.2px);
            mix-blend-mode: screen;
        }

        .piece-shell.black .piece-depth {
            transform: translate(0.09em, 0.115em) scale(1.03);
            color: rgba(0, 0, 0, 0.58);
            filter: blur(0.45px);
        }

        .piece-shell.black .piece-core {
            color: #2b1613;
            text-shadow:
                0 1px 0 rgba(255, 226, 196, 0.28),
                0 0 1px rgba(255, 240, 224, 0.92),
                0 10px 14px rgba(0, 0, 0, 0.3);
            -webkit-text-stroke: 0.5px rgba(255, 231, 208, 0.82);
        }

        .piece-shell.black .piece-highlight {
            transform: translate(-0.018em, -0.028em);
            color: rgba(255, 214, 173, 0.34);
            filter: blur(0.22px);
        }

        .piece-float {
            position: absolute;
            display: grid;
            place-items: center;
            transform-origin: center;
            will-change: transform, opacity, filter;
        }

        .piece-float.captured {
            z-index: 1;
        }

        .piece-float.moving {
            z-index: 2;
        }

        .hint {
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            body {
                padding: 12px;
            }

            .app {
                padding: 14px;
                gap: 16px;
            }

            .cell {
                font-size: 34px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="sidebar">
            <div>
                <h1>Local Chess</h1>
            </div>

            <div class="panel turn">
                <div id="turn-badge" class="turn-badge white">
                    <span class="turn-dot"></span>
                    <span id="turn-text">White to move</span>
                </div>
                <div class="hint">Take turns on one laptop: select your piece first, then choose its destination square.</div>
            </div>

            <div class="panel status">
                <strong>Game Status</strong>
                <div id="status-text">Loading...</div>
                <div class="meta">
                    <span id="selection-text">Selection: none</span>
                    <span id="last-move-text">Last move: none</span>
                </div>
            </div>

            <div class="panel captured">
                <strong>Captured Pieces</strong>
                <div class="captured-row">
                    <div class="captured-head">
                        <span>White lost</span>
                        <span id="captured-white-count" class="captured-count">0 pieces</span>
                    </div>
                    <div id="captured-white" class="captured-pieces"></div>
                </div>
                <div class="captured-row">
                    <div class="captured-head">
                        <span>Black lost</span>
                        <span id="captured-black-count" class="captured-count">0 pieces</span>
                    </div>
                    <div id="captured-black" class="captured-pieces"></div>
                </div>
            </div>

            <div class="actions">
                <button id="reset-button" type="button">New Game</button>
                <button id="refresh-button" class="secondary" type="button">Refresh</button>
            </div>
        </section>

        <section class="board-wrap">
            <div id="files" class="axis-files"></div>
            <div class="board-area">
                <div id="ranks" class="axis-ranks"></div>
                <div id="board" class="board">
                    <div id="animation-layer" class="animation-layer"></div>
                    <div id="victory-overlay" class="victory-overlay">
                        <div class="victory-card">
                            <div class="victory-kicker">Victory</div>
                            <h2 id="victory-title" class="victory-title">White Wins</h2>
                            <p id="victory-text" class="victory-text">The match is over.</p>
                            <button id="victory-restart" class="victory-button" type="button">Restart Game</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const boardElement = document.getElementById("board")
        const animationLayer = document.getElementById("animation-layer")
        const victoryOverlay = document.getElementById("victory-overlay")
        const victoryTitle = document.getElementById("victory-title")
        const victoryText = document.getElementById("victory-text")
        const victoryRestartButton = document.getElementById("victory-restart")
        const filesElement = document.getElementById("files")
        const ranksElement = document.getElementById("ranks")
        const turnBadge = document.getElementById("turn-badge")
        const turnText = document.getElementById("turn-text")
        const statusText = document.getElementById("status-text")
        const selectionText = document.getElementById("selection-text")
        const lastMoveText = document.getElementById("last-move-text")
        const capturedWhite = document.getElementById("captured-white")
        const capturedBlack = document.getElementById("captured-black")
        const capturedWhiteCount = document.getElementById("captured-white-count")
        const capturedBlackCount = document.getElementById("captured-black-count")
        const resetButton = document.getElementById("reset-button")
        const refreshButton = document.getElementById("refresh-button")

        const pieceSymbols = {
            white: {
                king: "♔",
                ferz: "♕",
                ladya: "♖",
                elephant: "♗",
                horse: "♘",
                peshka: "♙",
            },
            black: {
                king: "♚",
                ferz: "♛",
                ladya: "♜",
                elephant: "♝",
                horse: "♞",
                peshka: "♟",
            },
        }

        const fileLabels = ["A", "B", "C", "D", "E", "F", "G", "H"]
        const initialCounts = {
            white: { king: 1, ferz: 1, ladya: 2, elephant: 2, horse: 2, peshka: 8 },
            black: { king: 1, ferz: 1, ladya: 2, elephant: 2, horse: 2, peshka: 8 },
        }

        let gameState = null
        let isAnimating = false

        createBoard()
        bindEvents()
        loadGame()

        function bindEvents() {
            resetButton.addEventListener("click", async () => {
                await restartGame()
            })

            refreshButton.addEventListener("click", loadGame)
            victoryRestartButton.addEventListener("click", restartGame)
        }

        async function loadGame() {
            const response = await fetch("/api/game")
            gameState = await response.json()
            render()
        }

        function createBoard() {
            for (let index = 0; index < 64; index += 1) {
                const cell = document.createElement("button")
                cell.type = "button"
                cell.className = "cell"
                cell.addEventListener("click", async () => {
                    if (isAnimating) {
                        return
                    }

                    const x = Number(cell.dataset.x)
                    const y = Number(cell.dataset.y)

                    const response = await fetch("/api/click", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ x, y }),
                    })

                    const nextState = await response.json()
                    await animateTransition(gameState, nextState)
                    gameState = nextState
                    render()
                })

                boardElement.insertBefore(cell, animationLayer)
            }
        }

        function render() {
            const orientation = gameState.currentTurn === "white" ? "white" : "black"
            const displayCells = getDisplayCells(orientation)
            const selectedKey = gameState.selected ? toKey(gameState.selected) : null
            const legalKeys = new Set(gameState.legalMoves.map(toKey))
            const lastFromKey = gameState.lastMove ? toKey(gameState.lastMove.from) : null
            const lastToKey = gameState.lastMove ? toKey(gameState.lastMove.to) : null
            const cells = getBoardCells()

            renderAxes(orientation)

            cells.forEach((cell, index) => {
                const { x, y } = displayCells[index]
                const piece = getPieceAt([x, y])
                const isLight = (x + y) % 2 === 0
                const isSelected = selectedKey === `${x}:${y}`
                const isLegal = legalKeys.has(`${x}:${y}`)
                const isCapture = isLegal && piece && piece.color !== gameState.currentTurn

                cell.className = `cell ${isLight ? "light" : "dark"}`
                cell.classList.toggle("selected", isSelected)
                cell.classList.toggle("move", isLegal && !piece)
                cell.classList.toggle("capture", Boolean(isCapture))
                cell.classList.toggle("last-from", lastFromKey === `${x}:${y}`)
                cell.classList.toggle("last-to", lastToKey === `${x}:${y}`)

                cell.dataset.x = String(x)
                cell.dataset.y = String(y)
                cell.innerHTML = piece
                    ? renderPieceMarkup(piece)
                    : ""
            })

            turnBadge.className = `turn-badge ${gameState.currentTurn}`
            turnText.textContent = gameState.winner
                ? `${getColorLabel(gameState.winner)} win`
                : `${getColorLabel(gameState.currentTurn)} to move`

            statusText.textContent = gameState.message
            selectionText.textContent = gameState.selected
                ? `Selection: ${formatSquare(gameState.selected)}`
                : "Selection: none"
            lastMoveText.textContent = gameState.lastMove
                ? `Last move: ${formatSquare(gameState.lastMove.from)} -> ${formatSquare(gameState.lastMove.to)}`
                : "Last move: none"

            const captured = getCapturedPieces(gameState.board)
            capturedWhiteCount.textContent = formatCapturedCount(captured.white.count)
            capturedBlackCount.textContent = formatCapturedCount(captured.black.count)
            renderCapturedPieces(capturedWhite, captured.white.pieces)
            renderCapturedPieces(capturedBlack, captured.black.pieces)
            renderVictoryOverlay()
        }

        function renderAxes(orientation) {
            const files = orientation === "white" ? fileLabels : [...fileLabels].reverse()
            const ranks = orientation === "white"
                ? ["8", "7", "6", "5", "4", "3", "2", "1"]
                : ["1", "2", "3", "4", "5", "6", "7", "8"]

            filesElement.innerHTML = files.map((label) => `<span>${label}</span>`).join("")
            ranksElement.innerHTML = ranks.map((label) => `<span>${label}</span>`).join("")
        }

        function getDisplayCells(orientation) {
            const cells = []

            if (orientation === "white") {
                for (let y = 8; y >= 1; y -= 1) {
                    for (let x = 1; x <= 8; x += 1) {
                        cells.push({ x, y })
                    }
                }
                return cells
            }

            for (let y = 1; y <= 8; y += 1) {
                for (let x = 8; x >= 1; x -= 1) {
                    cells.push({ x, y })
                }
            }

            return cells
        }

        function getPieceAt(position) {
            return gameState.board.find((piece) => piece.addres[0] === position[0] && piece.addres[1] === position[1])
        }

        function getCapturedPieces(board) {
            const counts = countPieces(board)
            return {
                white: buildCapturedList("white", counts.white),
                black: buildCapturedList("black", counts.black),
            }
        }

        function countPieces(board) {
            const result = {
                white: { king: 0, ferz: 0, ladya: 0, elephant: 0, horse: 0, peshka: 0 },
                black: { king: 0, ferz: 0, ladya: 0, elephant: 0, horse: 0, peshka: 0 },
            }

            for (const piece of board) {
                result[piece.color][piece.kind] += 1
            }

            return result
        }

        function buildCapturedList(color, counts) {
            const pieces = []

            for (const kind of ["ferz", "ladya", "elephant", "horse", "peshka", "king"]) {
                const missing = initialCounts[color][kind] - counts[kind]
                for (let index = 0; index < missing; index += 1) {
                    pieces.push(pieceSymbols[color][kind])
                }
            }

            return {
                count: pieces.length,
                pieces,
            }
        }

        function renderCapturedPieces(container, data) {
            if (data.length === 0) {
                container.classList.add("empty")
                container.textContent = "No losses yet"
                return
            }

            container.classList.remove("empty")
            container.innerHTML = data
                .map((symbol) => {
                    const color = isWhitePieceSymbol(symbol) ? "white" : "black"
                    return renderPieceMarkup({ color, symbol }, "captured-piece")
                })
                .join(" ")
        }

        function formatCapturedCount(count) {
            return count === 1 ? "1 piece" : `${count} pieces`
        }

        function isWhitePieceSymbol(symbol) {
            return ["♔", "♕", "♖", "♗", "♘", "♙"].includes(symbol)
        }

        function toKey(position) {
            return `${position[0]}:${position[1]}`
        }

        function formatSquare([x, y]) {
            return `${fileLabels[x - 1]}${y}`
        }

        function getColorLabel(color) {
            return color === "white" ? "White" : "Black"
        }

        async function restartGame() {
            await fetch("/api/reset", { method: "POST" })
            await loadGame()
        }

        function renderVictoryOverlay() {
            if (!gameState.winner) {
                victoryOverlay.classList.remove("active")
                return
            }

            victoryTitle.textContent = `${getColorLabel(gameState.winner)} Wins`
            victoryText.textContent = gameState.message
            victoryOverlay.classList.add("active")
        }

        function getBoardCells() {
            return Array.from(boardElement.querySelectorAll(".cell"))
        }

        function renderPieceMarkup(piece, extraClass = "") {
            const symbol = piece.symbol ?? pieceSymbols[piece.color][piece.kind]
            const className = extraClass ? `piece-shell ${piece.color} ${extraClass}` : `piece-shell ${piece.color}`

            return `
                <span class="${className}">
                    <span class="piece-layer piece-depth">${symbol}</span>
                    <span class="piece-layer piece-core">${symbol}</span>
                    <span class="piece-layer piece-highlight">${symbol}</span>
                </span>
            `
        }

        async function animateTransition(previousState, nextState) {
            if (!previousState || !nextState || !hasNewMove(previousState, nextState)) {
                return
            }

            const move = nextState.lastMove
            const movingPiece = previousState.board.find((piece) => piece.id === move.pieceId)
            if (!movingPiece) {
                return
            }

            const sourceCell = getCellElement(move.from)
            const targetCell = getCellElement(move.to)
            if (!sourceCell || !targetCell) {
                return
            }

            const capturedPiece = previousState.board.find((piece) =>
                piece.addres[0] === move.to[0] && piece.addres[1] === move.to[1]
            )

            isAnimating = true

            sourceCell.classList.add("anim-source")
            if (capturedPiece) {
                targetCell.classList.add("anim-capture")
            }

            const movingToken = createFloatingPiece(movingPiece, sourceCell)
            const capturedToken = capturedPiece ? createFloatingPiece(capturedPiece, targetCell, "captured") : null

            if (movingToken) {
                animationLayer.appendChild(movingToken)
            }

            if (capturedToken) {
                animationLayer.appendChild(capturedToken)
            }

            const animations = []

            if (capturedToken) {
                animations.push(
                    waitForAnimation(
                        capturedToken.animate(
                            [
                                { transform: "scale(1)", opacity: 1, filter: "blur(0px)" },
                                { transform: "scale(1.2)", opacity: 1, filter: "blur(0px)", offset: 0.35 },
                                { transform: "scale(0.18)", opacity: 0, filter: "blur(6px)" },
                            ],
                            {
                                duration: 260,
                                easing: "cubic-bezier(0.25, 0.85, 0.38, 1)",
                                fill: "forwards",
                            }
                        )
                    )
                )
            }

            if (movingToken) {
                const delta = getTranslationDelta(sourceCell, targetCell)
                animations.push(
                    waitForAnimation(
                        movingToken.animate(
                            [
                                { transform: "translate(0px, 0px) scale(1)", offset: 0 },
                                { transform: `translate(${delta.x * 0.35}px, ${delta.y * 0.35}px) scale(1.08)`, offset: 0.35 },
                                { transform: `translate(${delta.x}px, ${delta.y}px) scale(1)`, offset: 1 },
                            ],
                            {
                                duration: 320,
                                easing: "cubic-bezier(0.22, 1, 0.36, 1)",
                                fill: "forwards",
                            }
                        )
                    )
                )
            }

            await Promise.all(animations)

            sourceCell.classList.remove("anim-source")
            targetCell.classList.remove("anim-capture")
            animationLayer.innerHTML = ""
            isAnimating = false
        }

        function hasNewMove(previousState, nextState) {
            if (!nextState.lastMove) {
                return false
            }

            if (!previousState.lastMove) {
                return true
            }

            return previousState.lastMove.pieceId !== nextState.lastMove.pieceId
                || previousState.lastMove.from[0] !== nextState.lastMove.from[0]
                || previousState.lastMove.from[1] !== nextState.lastMove.from[1]
                || previousState.lastMove.to[0] !== nextState.lastMove.to[0]
                || previousState.lastMove.to[1] !== nextState.lastMove.to[1]
        }

        function getCellElement(position) {
            return getBoardCells().find((element) =>
                Number(element.dataset.x) === position[0]
                && Number(element.dataset.y) === position[1]
            )
        }

        function createFloatingPiece(piece, cell, extraClass = "moving") {
            const cellRect = cell.getBoundingClientRect()
            const boardRect = boardElement.getBoundingClientRect()
            const token = document.createElement("span")

            token.className = `piece-float ${piece.color} ${extraClass}`
            token.innerHTML = renderPieceMarkup(piece)
            token.style.left = `${cellRect.left - boardRect.left}px`
            token.style.top = `${cellRect.top - boardRect.top}px`
            token.style.width = `${cellRect.width}px`
            token.style.height = `${cellRect.height}px`
            token.style.fontSize = `${cellRect.width * 0.72}px`

            return token
        }

        function getTranslationDelta(sourceCell, targetCell) {
            const sourceRect = sourceCell.getBoundingClientRect()
            const targetRect = targetCell.getBoundingClientRect()

            return {
                x: targetRect.left - sourceRect.left,
                y: targetRect.top - sourceRect.top,
            }
        }

        function waitForAnimation(animation) {
            return animation.finished.catch(() => undefined)
        }
    </script>
</body>
</html>
